workflows:
  ios-unsigned-ipa:
    name: LabDeck iOS (unsigned IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      # Vite 8 requires Node 20.19+ or 22.12+.
      node: lts
      xcode: latest
    scripts:
      - name: Install JavaScript dependencies
        script: |
          npm ci
          # Vite/Rolldown loads a macOS-native optional package. A clean `npm install`
          # keeps npm from dropping that package on Apple Silicon builders.
          rm -rf frontend/node_modules
          npm --prefix frontend install --include=optional --no-package-lock
      - name: Build web app and sync Capacitor iOS assets
        script: npm run cap:sync:ios
      - name: Archive iOS app without code signing
        script: |
          xcodebuild archive \
            -project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/LabDeck.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""
      - name: Package unsigned IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/build/Payload"
          cp -R "$CM_BUILD_DIR/build/LabDeck.xcarchive/Products/Applications/App.app" \
            "$CM_BUILD_DIR/build/Payload/LabDeck.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "$CM_BUILD_DIR/build/Payload" \
            "$CM_BUILD_DIR/build/LabDeck-unsigned.ipa"
    artifacts:
      - build/LabDeck-unsigned.ipa
      - build/LabDeck.xcarchive
      - /tmp/xcodebuild_logs/*.log
